<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des leads</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--surf:#fff;--ink:#1c2740;--mut:#667089;--line:#dfe3ea;--sun:#f0b400;--sunink:#3a2c00;--ok:#1f8a5b;--bad:#c2412d;--blue:#2d5bd1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121826;--surf:#1b2336;--ink:#e9edf6;--mut:#9aa5bf;--line:#2c3650;--ok:#4cc38a;--bad:#ff7a66;--blue:#7aa2ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surf);border-bottom:1px solid var(--line)}
h1{font-size:19px;font-weight:800;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.btn{background:var(--sun);color:var(--sunink);border:0;border-radius:8px;padding:9px 16px;font-weight:800;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding:20px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800}.kpi span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto;min-width:160px}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{flex:0 0 240px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px}
.col h3{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;color:var(--mut)}
.card{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.card b{display:block}small{color:var(--mut)}
.late{color:var(--bad);font-weight:700}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line)}
.list{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--mut)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:var(--surf);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow-y:auto;padding:16px 18px 24px;z-index:20;display:none}
#drawer.open{display:block}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:start}.dh h2{margin:0;font-size:20px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.f label{font-size:13px;color:var(--mut);display:block}.f .full{grid-column:1/-1}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.sec h4{margin:0 0 8px}
.ev{font-size:13px;padding:6px 0 6px 12px;border-left:2px solid var(--line);margin-left:4px}.ev em{color:var(--mut);font-style:normal}
.auth{max-width:380px;margin:12vh auto;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:24px}
.auth h1{margin-bottom:4px}.auth label{display:block;margin-top:12px;font-size:13px;color:var(--mut)}
.msg{margin-top:12px;font-size:13px;color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);width:min(480px,94%);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (max-width:600px){.f{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const C = window.APP_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const S = ["Nouveau","Contacté","RDV planifié","Devis envoyé","Négociation","Signé","Installé","Perdu"];
const COL = {"Nouveau":"#2d5bd1","Contacté":"#6b52d6","RDV planifié":"#0f8fa8","Devis envoyé":"#f0b400","Négociation":"#e07a1f","Signé":"#1f8a5b","Installé":"#157347","Perdu":"#c2412d"};
const T = ["Photovoltaïque","Pompe à chaleur","Isolation","Autre"];
let U=null, M=null, ORG="", LEADS=[], TEAM={}, DET={appels:[],devis:null,hist:[]}, view="pipe", sel=null, q="", ft="", chan=null;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => (Number(n)||0).toLocaleString("fr-FR")+" €";
const fd = s => s ? new Date(s).toLocaleDateString("fr-FR") : "—";
const today = () => new Date().toISOString().slice(0,10);
const dd = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const isLate = l => l.relance && l.relance < today() && !["Installé","Perdu"].includes(l.statut);
const canDel = () => M && ["manager","dirigeant"].includes(M.role);

/* ---------- Connexion ---------- */
function authView(){
  $("app").innerHTML = '<div class="auth"><h1>'+esc(C.NOM_PRODUIT||"Suivi des leads")+'</h1><small>Connectez-vous ou créez votre compte.</small>'+
  '<label>E-mail<input id="em" type="email" autocomplete="email"></label><label>Mot de passe (8 caractères minimum)<input id="pw" type="password" autocomplete="current-password"></label>'+
  '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="bin">Se connecter</button><button class="btn ghost" id="bup">Créer un compte</button></div><div class="msg" id="msg"></div></div>';
  $("bin").onclick = async () => {
    const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
    if(error) return $("msg").textContent = "Connexion impossible : "+error.message;
    route((await sb.auth.getSession()).data.session);
  };
  $("bup").onclick = async () => {
    const {data,error} = await sb.auth.signUp({email:$("em").value.trim(), password:$("pw").value});
    if(error) return $("msg").textContent = "Création impossible : "+error.message;
    if(data.session) route(data.session); else { $("msg").style.color="var(--ok)"; $("msg").textContent = "Compte créé. Confirmez votre e-mail puis connectez-vous."; }
  };
}
function onboardView(){
  $("app").innerHTML = '<div class="auth"><h1>Votre entreprise</h1><small>Dernière étape : créez l’espace de votre équipe.</small>'+
  '<label>Nom de l’entreprise<input id="oe"></label><label>Votre nom<input id="on"></label>'+
  '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="ok">Créer mon espace</button><button class="btn ghost" id="out">Se déconnecter</button></div><div class="msg" id="msg"></div></div>';
  $("out").onclick = () => sb.auth.signOut();
  $("ok").onclick = async () => {
    if(!$("oe").value.trim()||!$("on").value.trim()) return $("msg").textContent="Renseignez les deux champs.";
    const {error} = await sb.rpc("creer_entreprise",{nom_entreprise:$("oe").value.trim(), nom_utilisateur:$("on").value.trim()});
    if(error) return $("msg").textContent = "Création impossible : "+error.message;
    route((await sb.auth.getSession()).data.session);
  };
}
async function route(session){
  if(!session){ U=null; M=null; if(chan) sb.removeChannel(chan); return authView(); }
  U = session.user;
  const {data:m} = await sb.from("membres").select("org_id,role,nom").eq("user_id",U.id).maybeSingle();
  if(!m) return onboardView();
  M = m;
  const {data:o} = await sb.from("organisations").select("nom").eq("id",m.org_id).single();
  ORG = o ? o.nom : "";
  const {data:t} = await sb.from("membres").select("user_id,nom");
  (t||[]).forEach(x => TEAM[x.user_id]=x.nom);
  await loadLeads(); shell(); subscribe();
}
async function loadLeads(){
  const {data,error} = await sb.from("leads").select("*").order("created_at",{ascending:false});
  if(error) console.error(error); LEADS = data||[];
}
function subscribe(){
  if(chan) sb.removeChannel(chan);
  chan = sb.channel("leads-"+M.org_id).on("postgres_changes",{event:"*",schema:"public",table:"leads",filter:"org_id=eq."+M.org_id}, async () => {
    await loadLeads(); render();
    if(sel && !$("drawer").contains(document.activeElement)) openDrawer(sel);
  }).subscribe();
}

/* ---------- Écran principal ---------- */
function shell(){
  $("app").innerHTML = '<header><div><h1>'+esc(C.NOM_PRODUIT||"Suivi des leads")+'</h1><small>'+esc(ORG)+' · '+esc(M.nom||"")+' ('+esc(M.role)+')</small></div><nav id="nav"></nav>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="csv">Exporter en CSV</button><button class="btn ghost" data-act="out">Déconnexion</button><button class="btn" data-act="new">Nouveau lead</button></div></header>'+
  '<main id="main"></main><aside id="drawer" aria-label="Fiche lead"></aside>'+
  '<dialog id="dlg"><h2 style="margin-top:0">Nouveau lead</h2><div class="f"><div class="full"><label>Nom du client<input id="n_nom"></label></div><div><label>Téléphone<input id="n_tel" type="tel"></label></div><div><label>E-mail<input id="n_mail" type="email"></label></div><div><label>Ville<input id="n_ville"></label></div><div><label>Projet<select id="n_type">'+T.map(t=>"<option>"+t+"</option>").join("")+'</select></label></div><div><label>Source<select id="n_src"><option>Appel entrant</option><option>Appel sortant</option><option>Site web</option><option>Recommandation</option><option>Salon</option></select></label></div><div><label>Montant estimé (€)<input id="n_mt" type="number" min="0"></label></div></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-act="ncancel">Annuler</button><button class="btn" data-act="nok">Créer le lead</button></div></dialog>';
  render();
}
function match(l){ const s=(l.nom+(l.ville||"")+(l.tel||"")).toLowerCase(); return (!q||s.includes(q.toLowerCase())) && (!ft||l.type===ft); }
function kpis(){
  const act=LEADS.filter(l=>!["Installé","Perdu","Signé"].includes(l.statut)), won=LEADS.filter(l=>["Signé","Installé"].includes(l.statut)), lost=LEADS.filter(l=>l.statut==="Perdu");
  const sum=a=>a.reduce((s,l)=>s+(Number(l.montant)||0),0), cl=won.length+lost.length;
  return '<div class="kpis"><div class="kpi"><b>'+act.length+'</b><span>Leads en cours</span></div><div class="kpi"><b>'+eur(sum(act))+'</b><span>Potentiel en cours</span></div><div class="kpi"><b>'+eur(sum(won))+'</b><span>Contrats signés</span></div><div class="kpi"><b>'+(cl?Math.round(won.length/cl*100)+" %":"—")+'</b><span>Taux de conversion</span></div><div class="kpi"><b class="'+(LEADS.some(isLate)?"late":"")+'">'+LEADS.filter(isLate).length+'</b><span>Relances en retard</span></div></div>';
}
function filters(){ return '<div class="bar"><input id="q" placeholder="Rechercher un nom, une ville, un numéro" value="'+esc(q)+'"><select id="ft"><option value="">Tous les projets</option>'+T.map(t=>'<option'+(ft===t?" selected":"")+'>'+t+'</option>').join("")+'</select></div>'; }
function card(l){ return '<button class="card" style="--c:'+COL[l.statut]+'" data-id="'+l.id+'"><b>'+esc(l.nom)+'</b><small>'+esc(l.type)+' · '+esc(l.ville||"")+'</small><br><small>'+eur(l.montant)+'</small><br><small class="'+(isLate(l)?"late":"")+'">Relance : '+fd(l.relance)+'</small></button>'; }
function render(){
  const tabs=[["pipe","Pipeline"],["todo","À relancer"]];
  $("nav").innerHTML = tabs.map(t=>'<button class="tab" data-v="'+t[0]+'" aria-current="'+(view===t[0])+'">'+t[1]+'</button>').join("");
  let h="";
  if(view==="pipe"){
    h = kpis()+filters()+'<div class="board">'+S.map(s=>{ const xs=LEADS.filter(l=>l.statut===s&&match(l)); return '<section class="col"><h3><span>'+s+'</span><span>'+xs.length+'</span></h3>'+(xs.map(card).join("")||'<small>Aucun lead</small>')+'</section>'; }).join("")+'</div>';
  } else {
    const xs=LEADS.filter(l=>match(l)&&!["Installé","Perdu"].includes(l.statut)).sort((a,b)=>(a.relance||"9")<(b.relance||"9")?-1:1);
    h = filters()+'<div class="list">'+(xs.map(l=>'<div class="row" data-id="'+l.id+'"><div><b>'+esc(l.nom)+'</b><br><small>'+esc(l.type)+' · '+esc(l.tel||"")+'</small></div><span class="tag" style="background:'+COL[l.statut]+'33">'+l.statut+'</span><span class="'+(isLate(l)?"late":"")+'">'+(isLate(l)?"En retard : ":"")+fd(l.relance)+'</span></div>').join("")||'<div class="empty">Aucune relance prévue. Créez votre premier lead.</div>')+'</div>';
  }
  $("main").innerHTML = h;
}

/* ---------- Fiche lead ---------- */
async function openDrawer(id){
  sel = id; const l = LEADS.find(x=>x.id===id); const d=$("drawer");
  if(!l){ d.classList.remove("open"); return; }
  const [a,dv,h] = await Promise.all([
    sb.from("appels").select("*").eq("lead_id",id).order("created_at",{ascending:false}),
    sb.from("devis").select("*").eq("lead_id",id).order("created_at",{ascending:false}).limit(1),
    sb.from("historique").select("*").eq("lead_id",id).order("created_at",{ascending:false})
  ]);
  DET = {appels:a.data||[], devis:(dv.data||[])[0]||null, hist:h.data||[]};
  const dev = DET.devis || {montant:l.montant, statut:"Brouillon"};
  d.classList.add("open");
  d.innerHTML = '<div class="dh"><div><h2>'+esc(l.nom)+'</h2><small>'+esc(l.type)+' · '+esc(l.ville||"")+' · '+esc(l.source||"")+(l.responsable&&TEAM[l.responsable]?' · Responsable : '+esc(TEAM[l.responsable]):'')+'</small></div><button class="btn ghost" data-act="close">Fermer</button></div>'+
  '<div class="f"><div><label>Statut<select id="d_st">'+S.map(s=>'<option'+(s===l.statut?" selected":"")+'>'+s+'</option>').join("")+'</select></label></div><div><label>Prochaine relance<input id="d_rel" type="date" value="'+esc(l.relance||"")+'"></label></div><div><label>Montant estimé (€)<input id="d_mt" type="number" value="'+esc(l.montant)+'"></label></div><div><label>Téléphone<input id="d_tel" value="'+esc(l.tel||"")+'"></label></div><div class="full"><label>Notes internes<textarea id="d_notes" rows="2">'+esc(l.notes||"")+'</textarea></label></div></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="saveinfo">Enregistrer la fiche</button><button class="btn ghost" data-act="link">Copier le lien client</button></div>'+
  '<div class="sec"><h4>Consigner un appel</h4><div class="f"><div><label>Résultat<select id="c_res"><option>Répondu</option><option>Pas de réponse</option><option>Messagerie</option><option>Rappel demandé</option></select></label></div><div><label>Rappeler le<input id="c_rel" type="date" value="'+dd(2)+'"></label></div><div class="full"><label>Note<input id="c_note" placeholder="Ce qui a été dit"></label></div></div><button class="btn" data-act="call">Enregistrer l’appel</button>'+DET.appels.map(x=>'<div class="ev"><em>'+fd(x.created_at)+'</em> · '+esc(x.resultat)+(x.note?' — '+esc(x.note):'')+'</div>').join("")+'</div>'+
  '<div class="sec"><h4>Devis</h4><div class="f"><div><label>Montant (€)<input id="q_mt" type="number" value="'+esc(dev.montant)+'"></label></div><div><label>État<select id="q_st">'+["Brouillon","Envoyé","Accepté","Refusé"].map(s=>'<option'+(s===dev.statut?" selected":"")+'>'+s+'</option>').join("")+'</select></label></div></div><button class="btn" data-act="devis">Enregistrer le devis</button></div>'+
  '<div class="sec"><h4>Historique</h4>'+DET.hist.map(x=>'<div class="ev"><em>'+fd(x.created_at)+'</em> · '+esc(x.texte)+(x.user_id&&TEAM[x.user_id]?' <em>('+esc(TEAM[x.user_id])+')</em>':'')+'</div>').join("")+'</div>'+
  (canDel()?'<div class="sec"><button class="btn ghost" data-act="del">Supprimer ce lead</button></div>':'');
}
async function hist(leadId, txt){ await sb.from("historique").insert({org_id:M.org_id, lead_id:leadId, user_id:U.id, texte:txt}); }
async function act(a){
  const v = id => $(id).value, l = LEADS.find(x=>x.id===sel);
  try{
    if(a==="saveinfo"){
      const upd={statut:v("d_st"),relance:v("d_rel")||null,montant:Number(v("d_mt"))||0,tel:v("d_tel"),notes:v("d_notes")};
      const {error}=await sb.from("leads").update(upd).eq("id",l.id); if(error)throw error;
      if(upd.statut!==l.statut) await hist(l.id,"Statut : "+upd.statut);
    }
    if(a==="call"){
      const {error}=await sb.from("appels").insert({org_id:M.org_id,lead_id:l.id,user_id:U.id,resultat:v("c_res"),note:v("c_note")}); if(error)throw error;
      const upd={relance:v("c_rel")||null}; if(l.statut==="Nouveau"&&v("c_res")==="Répondu") upd.statut="Contacté";
      await sb.from("leads").update(upd).eq("id",l.id);
      await hist(l.id,"Appel : "+v("c_res")); if(upd.statut) await hist(l.id,"Statut : Contacté");
    }
    if(a==="devis"){
      const st=v("q_st");
      const {error}=await sb.from("devis").insert({org_id:M.org_id,lead_id:l.id,montant:Number(v("q_mt"))||0,statut:st}); if(error)throw error;
      const map={"Envoyé":"Devis envoyé","Accepté":"Signé","Refusé":"Perdu"};
      await hist(l.id,"Devis "+st.toLowerCase());
      if(map[st]&&l.statut!==map[st]){ await sb.from("leads").update({statut:map[st]}).eq("id",l.id); await hist(l.id,"Statut : "+map[st]); }
    }
    if(a==="del"){
      if(!confirm("Supprimer définitivement ce lead ?")) return;
      const {error}=await sb.from("leads").delete().eq("id",l.id); if(error)throw error; sel=null;
    }
    await loadLeads(); render(); if(sel) openDrawer(sel); else $("drawer").classList.remove("open");
  }catch(e){ alert("Action impossible : "+(e.message||e)); }
}
async function createLead(){
  const v = id => $(id).value.trim();
  if(!v("n_nom")) return $("n_nom").focus();
  const {data,error} = await sb.from("leads").insert({org_id:M.org_id,nom:v("n_nom"),tel:v("n_tel"),email:v("n_mail"),ville:v("n_ville"),type:v("n_type"),source:v("n_src"),montant:Number(v("n_mt"))||0,relance:today(),responsable:U.id}).select().single();
  if(error) return alert("Création impossible : "+error.message);
  await hist(data.id,"Lead créé");
  ["n_nom","n_tel","n_mail","n_ville","n_mt"].forEach(i=>$(i).value="");
  $("dlg").close(); await loadLeads(); view="pipe"; render(); openDrawer(data.id);
}
function csv(){
  const rows=[["Nom","Téléphone","E-mail","Ville","Projet","Source","Statut","Montant estimé","Relance","Notes"]].concat(LEADS.map(l=>[l.nom,l.tel,l.email,l.ville,l.type,l.source,l.statut,l.montant,l.relance,l.notes]));
  const txt="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"})); a.download="leads-"+today()+".csv"; a.click();
}

/* ---------- Événements ---------- */
document.addEventListener("click", e => {
  const t=e.target; let el;
  if(el=t.closest("[data-v]")){ view=el.dataset.v; return render(); }
  if(el=t.closest("[data-act]")){
    const a=el.dataset.act;
    if(a==="close"){ sel=null; return $("drawer").classList.remove("open"); }
    if(a==="out") return sb.auth.signOut();
    if(a==="new") return $("dlg").showModal();
    if(a==="ncancel") return $("dlg").close();
    if(a==="nok") return createLead();
    if(a==="csv") return csv();
    if(a==="link"){ const l=LEADS.find(x=>x.id===sel); const u=location.origin+location.pathname.replace(/[^/]*$/,"")+"suivi.html?t="+l.share_token; return navigator.clipboard.writeText(u).then(()=>alert("Lien client copié.\n"+u)); }
    return act(a);
  }
  if(el=t.closest("[data-id]")){ openDrawer(el.dataset.id); }
});
document.addEventListener("input", e => { if(e.target.id==="q"){ q=e.target.value; const p=e.target.selectionStart; render(); const n=$("q"); n.focus(); n.setSelectionRange(p,p); } });
document.addEventListener("change", e => { if(e.target.id==="ft"){ ft=e.target.value; render(); } });
sb.auth.onAuthStateChange(ev => { if(ev==="SIGNED_OUT") route(null); });
sb.auth.getSession().then(r => route(r.data.session));
